<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ClinicPay clinic dashboard: split-payer invoices settled on NEAR.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d7c6c'/%3E%3Cpath d='M16 9v14M9 16h14' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Dashboard · ClinicPay</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<script type="module">
import { invoicesToCsv } from "../cli/lib.mjs";
import {
  config, pageUrl, view, money, pct, date, ago, h, icon, pill, acct, avatar, toast, emptyState, errorBanner, topbar, setNetworkState,
} from "./ui.mjs";

const params = new URLSearchParams(location.search);
const cfg = config(params);
const clinic = params.get("clinic") || "";
const app = document.getElementById("app");
const state = { invoices: [], statuses: new Map(), metas: new Map(), currency: null, filter: "all", query: "", loadedAt: null };

app.append(topbar(cfg, "dashboard", { clinic }));
const main = h("main", { class: "page", id: "main" });
app.append(main, h("footer", { class: "foot" },
  h("span", {}, "Read-only. This page signs nothing and holds no keys. Every number comes from the contract's view calls."),
  h("span", {}, "ClinicPay on NEAR")));

if (!cfg.contract || !clinic) renderConnect(); else load();

// ---- connect screen ------------------------------------------------------------
function renderConnect() {
  document.title = "Open a clinic · ClinicPay";
  const custom = h("div", { class: "field", hidden: true },
    h("label", { for: "rpc" }, "RPC URL"), h("input", { class: "input", id: "rpc", name: "rpc", placeholder: "http://127.0.0.1:3030", value: params.get("rpc") || "" }));
  const net = h("select", { class: "select", id: "network", name: "network", onchange: () => { custom.hidden = net.value !== "custom"; } },
    h("option", { value: "testnet" }, "Testnet"), h("option", { value: "mainnet" }, "Mainnet"), h("option", { value: "custom" }, "Custom RPC (local sandbox)"));
  if (params.get("rpc")) { net.value = "custom"; custom.hidden = false; }
  const form = h("form", { class: "card-body", onsubmit: (e) => {
    e.preventDefault();
    const d = new FormData(form);
    const p = new URLSearchParams({ contract: d.get("contract").trim(), clinic: d.get("clinic").trim() });
    if (d.get("network") === "custom") p.set("rpc", d.get("rpc").trim()); else if (d.get("network") !== "testnet") p.set("network", d.get("network"));
    location.search = p.toString();
  } },
    h("div", {}, h("h1", {}, "Open your clinic dashboard"), h("p", {}, "See every invoice, who still owes what, and every insurer decision, read live from NEAR.")),
    h("div", { class: "field" }, h("label", { for: "contract" }, "ClinicPay contract"), h("input", { class: "input", id: "contract", name: "contract", required: true, placeholder: "clinicpay.testnet", value: cfg.contract, autocomplete: "off" })),
    h("div", { class: "field" }, h("label", { for: "clinic" }, "Clinic account"), h("input", { class: "input", id: "clinic", name: "clinic", required: true, placeholder: "yourclinic.testnet", value: clinic, autocomplete: "off" }),
      h("span", { class: "hint" }, "The NEAR account that created the invoices and receives the payments.")),
    h("div", { class: "field" }, h("label", { for: "network" }, "Network"), net),
    custom,
    h("button", { class: "btn btn-primary", type: "submit", style: "height:40px" }, "Open dashboard", icon("arrow")));
  main.replaceChildren(h("div", { class: "connect card" }, form));
}

// ---- data ---------------------------------------------------------------------------
async function listAll() {
  const out = [];
  for (let from = 0; ; from += 50) {
    const page = await view(cfg.rpc, cfg.contract, "list_invoices", { payee: clinic, from_index: from, limit: 50 });
    out.push(...page);
    if (page.length < 50) return out;
  }
}

async function load() {
  document.title = "Dashboard · ClinicPay";
  if (!state.loadedAt) renderSkeleton();
  const btn = document.getElementById("refresh"); btn?.classList.add("spin"); btn && (btn.disabled = true);
  try {
    const invoices = await listAll();
    const statuses = new Map(await Promise.all(invoices.map(async (i) => [i.id, await view(cfg.rpc, cfg.contract, "get_status", { invoice_id: i.id })])));
    const metas = new Map([["NEAR", { decimals: 24, symbol: "NEAR" }]]);
    for (const t of new Set(invoices.map((i) => i.token).filter(Boolean))) metas.set(t, await view(cfg.rpc, t, "ft_metadata", {}));
    Object.assign(state, { invoices, statuses, metas, loadedAt: Date.now() });
    const currencies = currencyKeys();
    if (!currencies.includes(state.currency)) state.currency = currencies[0] ?? null;
    setNetworkState(true);
    render();
  } catch (e) {
    setNetworkState(false);
    main.replaceChildren(header(), errorBanner(e.message, load));
  }
}

function currencyKeys() {
  const by = new Map();
  for (const inv of state.invoices) { const k = inv.token ?? "NEAR"; by.set(k, (by.get(k) ?? 0) + 1); }
  return [...by.entries()].sort((a, b) => b[1] - a[1]).map(([k]) => k);
}
const metaOf = (inv) => state.metas.get(inv.token ?? "NEAR");
const totalOf = (inv) => inv.lines.reduce((a, l) => a + BigInt(l.amount), 0n);
const paidOf = (inv) => inv.shares.filter((s) => s.state === "Paid").reduce((a, s) => a + BigInt(s.amount), 0n);

function summarize(invoices) {
  const t = { billed: 0n, collected: 0n, outstanding: 0n, refunded: 0n, adjusted: 0n, denied: 0, openShares: 0, decisions: 0 };
  for (const inv of invoices) {
    if (inv.cancelled) continue;
    t.billed += totalOf(inv);
    for (const s of inv.shares) {
      if (s.state === "Paid") t.collected += BigInt(s.amount);
      if (s.state === "Open") { t.outstanding += BigInt(s.amount); t.openShares++; }
      if (s.state === "Refunded") t.refunded += BigInt(s.amount);
      if (s.state === "Denied") t.denied++;
      if (s.adjudication) { t.decisions++; t.adjusted += BigInt(s.adjudication.original) - BigInt(s.adjudication.approved); }
    }
  }
  return t;
}

// ---- views ----------------------------------------------------------------------------
function header() {
  const refresh = h("button", { class: "btn", id: "refresh", type: "button", onclick: load }, icon("refresh"), "Refresh");
  const csv = h("button", { class: "btn btn-primary", type: "button", onclick: downloadCsv, disabled: !state.invoices.length }, icon("download"), "Export CSV");
  return h("div", { class: "page-head" },
    h("div", {},
      h("h1", {}, "Clinic overview"),
      h("div", { class: "sub" }, avatar(clinic), acct(clinic, { cfg }),
        state.loadedAt ? h("span", { class: "muted", id: "updated", title: new Date(state.loadedAt).toLocaleString() }, `· Updated ${ago(state.loadedAt)}`) : null)),
    h("div", { class: "actions" }, refresh, csv));
}

function renderSkeleton() {
  const sk = (w, hgt = 14) => h("div", { class: "skel", style: `width:${w};height:${hgt}px` });
  const kpis = h("div", { class: "kpis" }, ...[0, 1, 2, 3].map(() => h("div", { class: "card kpi" }, sk("40%"), h("div", { style: "height:14px" }), sk("70%", 26), h("div", { style: "height:12px" }), sk("55%"))));
  const rows = h("div", { class: "card" }, h("div", { class: "card-head" }, sk("120px", 16)),
    h("div", { class: "card-body", style: "display:grid;gap:18px" }, ...[0, 1, 2, 3, 4].map(() => sk("100%", 18))));
  main.replaceChildren(header(), kpis, rows);
}

function render() {
  const all = state.invoices;
  if (!all.length) {
    main.replaceChildren(header(), h("div", { class: "card" }, emptyState("file", "No invoices yet",
      "Invoices this clinic creates on the contract appear here, with every payment as it settles.")));
    return;
  }
  const cur = state.currency;
  const meta = state.metas.get(cur);
  const inCur = all.filter((i) => (i.token ?? "NEAR") === cur);
  const t = summarize(inCur);
  const currencies = currencyKeys();

  const tabs = currencies.length > 1 ? h("div", { class: "tabs", role: "tablist", "aria-label": "Currency", style: "margin-bottom:16px" },
    ...currencies.map((k) => h("button", { role: "tab", type: "button", "aria-selected": String(k === cur), title: k === "NEAR" ? "Native NEAR" : `NEP-141 token ${k}`,
      onclick: () => { state.currency = k; render(); } }, state.metas.get(k).symbol))) : null;

  const rate = pct(t.collected, t.billed);
  const kpi = (label, ico, tone, value, foot, meter) => h("div", { class: "card kpi" },
    h("div", { class: "kpi-top" }, label, h("span", { class: `kpi-ico ${tone}` }, icon(ico))),
    h("div", { class: "kpi-val num" }, value[0], h("small", {}, value[1])),
    meter !== undefined ? h("div", { class: "meter", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": String(rate), "aria-label": "Collected" }, h("span", { style: `width:${meter}%` })) : null,
    h("div", { class: "kpi-foot" }, foot));
  const split = (v) => { const s = money(v, meta); const i = s.lastIndexOf(" "); return [s.slice(0, i), s.slice(i + 1)]; };
  const kpis = h("div", { class: "kpis" },
    kpi("Billed", "file", "", split(t.billed), `${inCur.length} invoice${inCur.length === 1 ? "" : "s"}${t.refunded > 0n ? ` · ${money(t.refunded, meta)} refunded` : ""}`),
    kpi("Collected", "check", "brand", split(t.collected), `${rate}% of billed, settled straight to the clinic`, rate),
    kpi("Outstanding", "clock", "warn", split(t.outstanding), `${t.openShares} open share${t.openShares === 1 ? "" : "s"}`),
    kpi("Insurer adjustments", "scale", "info", split(t.adjusted), `${t.decisions} decision${t.decisions === 1 ? "" : "s"}${t.denied ? ` · ${t.denied} denied` : ""} · moved to other payers`));

  main.replaceChildren(header(), tabs ?? "", kpis,
    h("div", { class: "grid grid-main" }, invoicesCard(inCur, meta), h("div", { class: "stack" }, owedCard(inCur, meta), decisionsCard(inCur, meta))));
}

// One timer for the page: keeps "Updated N min ago" fresh across re-renders.
setInterval(() => {
  const u = document.getElementById("updated");
  if (u && state.loadedAt) u.textContent = `· Updated ${ago(state.loadedAt)}`;
}, 30000);

function invoicesCard(list, meta) {
  const FILTERS = [["all", "All"], ["due", "Awaiting payment"], ["Overdue", "Overdue"], ["Paid", "Paid"], ["Cancelled", "Cancelled"]];
  const st = (inv) => state.statuses.get(inv.id);
  const match = (inv, f) => f === "all" || (f === "due" ? ["Open", "PartiallyPaid", "Overdue"].includes(st(inv)) : st(inv) === f);
  const q = state.query.toLowerCase();
  const rows = [...list].reverse().filter((inv) => match(inv, state.filter))
    .filter((inv) => !q || inv.id.toLowerCase().includes(q) || inv.memo.toLowerCase().includes(q) || inv.shares.some((s) => (s.payer ?? "").toLowerCase().includes(q)));

  const tbody = h("tbody", {}, ...rows.map((inv) => {
    const total = totalOf(inv), paid = paidOf(inv);
    const href = pageUrl("invoice.html", cfg, { id: inv.id });
    const go = () => { location.href = href; };
    // The invoice id is a real link (one keyboard stop per row, Enter opens it); the whole row is a mouse target too.
    return h("tr", { class: "link", onclick: go },
      h("td", {}, h("a", { class: "title", href, onclick: (e) => e.stopPropagation() }, inv.id), h("div", { class: "desc" }, inv.memo || "—")),
      h("td", {}, pill(st(inv))),
      h("td", { class: "r num" }, h("div", { class: "title" }, money(total, meta)), h("div", { class: "desc" }, `${money(paid, meta)} paid`)),
      h("td", { class: "hide-sm muted" }, date(inv.created_ms)));
  }));
  const search = h("div", { class: "search", style: "min-width:200px;flex:1;max-width:280px" }, icon("search"),
    h("input", { class: "input", type: "search", placeholder: "Search invoices or payers", "aria-label": "Search invoices", value: state.query,
      oninput: (e) => { state.query = e.target.value; const pos = e.target.selectionStart; render(); const n = document.querySelector(".search input"); n.focus(); n.setSelectionRange(pos, pos); } }));
  const chips = h("div", { class: "chips", role: "group", "aria-label": "Filter by status" }, ...FILTERS.map(([k, label]) =>
    h("button", { class: "chip", type: "button", "aria-pressed": String(state.filter === k), onclick: () => { state.filter = k; render(); } },
      label, h("span", { class: "count" }, String(list.filter((i) => match(i, k)).length)))));

  return h("section", { class: "card", "aria-labelledby": "inv-h" },
    h("div", { class: "card-head" }, h("h2", { id: "inv-h" }, "Invoices"), search),
    h("div", { style: "padding:12px 20px;border-bottom:1px solid var(--border)" }, chips),
    rows.length
      ? h("div", { class: "table-wrap" }, h("table", { class: "table" },
          h("thead", {}, h("tr", {}, h("th", {}, "Invoice"), h("th", {}, "Status"), h("th", { class: "r" }, "Amount"), h("th", { class: "hide-sm" }, "Created"))), tbody))
      : emptyState("search", "No matching invoices", "Try another filter or search term."));
}

function owedCard(list, meta) {
  const owed = new Map();
  for (const inv of list) {
    if (inv.cancelled) continue;
    for (const s of inv.shares) {
      if (s.state !== "Open") continue;
      const k = s.payer ?? "anyone";
      const o = owed.get(k) ?? { payer: s.payer, amount: 0n, invoices: new Set(), label: s.label };
      o.amount += BigInt(s.amount); o.invoices.add(inv.id); owed.set(k, o);
    }
  }
  const items = [...owed.values()].sort((a, b) => (b.amount > a.amount ? 1 : b.amount < a.amount ? -1 : 0));
  return h("section", { class: "card", "aria-labelledby": "owed-h" },
    h("div", { class: "card-head" }, h("h2", { id: "owed-h" }, "Who still owes"), h("span", { class: "meta" }, meta.symbol)),
    items.length ? h("ul", { class: "list" }, ...items.map((o) => h("li", {},
      o.payer ? avatar(o.payer) : h("span", { class: "avatar", style: "background:var(--text-3)" }, "?"),
      h("div", { class: "grow" }, o.payer ? acct(o.payer, { cfg }) : h("span", { class: "muted" }, "Anyone"),
        h("div", { class: "muted", style: "font-size:12.5px" }, `${o.label} · ${[...o.invoices].join(", ")}`)),
      h("span", { class: "amt" }, money(o.amount, meta)))))
      : emptyState("check", "All settled", "No open shares in this currency."));
}

function decisionsCard(list, meta) {
  const items = [];
  for (const inv of list) inv.shares.forEach((s, i) => { if (s.adjudication) items.push({ inv, s, i }); });
  items.sort((a, b) => Number(b.s.adjudication.at_ms) - Number(a.s.adjudication.at_ms));
  return h("section", { class: "card", "aria-labelledby": "dec-h" },
    h("div", { class: "card-head" }, h("h2", { id: "dec-h" }, "Insurer decisions"), h("span", { class: "meta" }, "signed on chain")),
    items.length ? h("ul", { class: "list" }, ...items.map(({ inv, s }) => {
      const a = s.adjudication;
      const denied = a.approved === "0";
      return h("li", { style: "align-items:flex-start" },
        avatar(s.payer),
        h("div", { class: "grow" },
          h("div", { style: "display:flex;gap:8px;align-items:center;flex-wrap:wrap" },
            h("a", { class: "title", href: pageUrl("invoice.html", cfg, { id: inv.id }), style: "font-weight:600;color:var(--text)" }, inv.id),
            denied ? pill("Denied") : h("span", { class: "pill info" }, "Adjusted")),
          h("div", { style: "margin-top:4px" }, `"${a.reason}"`),
          h("div", { class: "muted", style: "font-size:12.5px;margin-top:2px" }, `${date(a.at_ms)} · by `, acct(s.payer, { cfg }))),
        h("div", { style: "text-align:right" }, h("div", { class: "strike num" }, money(a.original, meta)), h("div", { class: "amt" }, money(a.approved, meta))));
    }))
      : emptyState("scale", "No decisions yet", "When an insurer approves less than billed, it shows here with its reason."));
}

function downloadCsv() {
  const csv = invoicesToCsv(state.invoices, (inv) => state.statuses.get(inv.id), (t) => state.metas.get(t));
  const a = h("a", { href: URL.createObjectURL(new Blob([csv], { type: "text/csv" })), download: `clinicpay-${clinic}-${new Date().toISOString().slice(0, 10)}.csv` });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Exported ${state.invoices.length} invoices`);
}
</script>
</body>
</html>
