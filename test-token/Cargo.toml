[package]
name = "test-token"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimal NEP-141 token used only by ClinicPay's sandbox tests (no value)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true
